<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeSwap NFT Card — reference2</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1118; }
  </style>
</head>
<body>
<svg xmlns='http://www.w3.org/2000/svg' width='350' height='480' viewBox='0 0 350 480'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#276f61'/><stop offset='.46' stop-color='#13233a'/><stop offset='1' stop-color='#584a34'/>
    </linearGradient>
    <radialGradient id='glow' cx='18%' cy='6%' r='72%'>
      <stop offset='0' stop-color='#37d6a3' stop-opacity='.42'/><stop offset='1' stop-color='#37d6a3' stop-opacity='0'/>
    </radialGradient>
    <style>
      .t{font-family:'Inter','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'Roboto Mono',ui-monospace,monospace}
      .w{fill:#fff}.w9{fill:#fff;fill-opacity:.9}.w5{fill:#fff;fill-opacity:.5}.w4{fill:#fff;fill-opacity:.4}
      .g{fill:#37d6a3}.gs{fill:#37d6a3;fill-opacity:.6}
      .val{font-weight:700}.lbl{font-weight:600;letter-spacing:.4}.sym{font-size:12px}
      .panel{fill:#08131f;fill-opacity:.4;stroke:#fff;stroke-opacity:.06}
      .chip{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.1}
    </style>
  </defs>

  <rect width='350' height='480' rx='24' fill='url(#bg)'/>
  <rect width='350' height='480' rx='24' fill='url(#glow)'/>
  <rect x='.5' y='.5' width='349' height='479' rx='23.5' fill='none' stroke='#fff' stroke-opacity='.1'/>

  <!-- top bar: 8-byte token id (left), brand (right) -->
  <text x='24' y='43' class='m w9 val' font-size='15'>0x1122334455667788</text>
  <text x='326' y='43' text-anchor='end' class='t' font-size='13' font-weight='700'><tspan class='w9'>Safe</tspan><tspan class='g'>Swap</tspan></text>

  <!-- hero: current position - pair highlighted first, amounts second -->
  <text x='175' y='90' text-anchor='middle' class='t w4 lbl' font-size='11'>CURRENT POSITION</text>
  <text x='90' y='126' text-anchor='middle' class='t w val' font-size='23'>TKNA</text>
  <text x='90' y='158' text-anchor='middle' class='t w9' font-size='26' font-weight='600'>0.42</text>
  <text x='260' y='126' text-anchor='middle' class='t w val' font-size='23'>TKNB</text>
  <text x='260' y='158' text-anchor='middle' class='t w9' font-size='26' font-weight='600'>1,280</text>
  <line x1='24' y1='184' x2='326' y2='184' stroke='#fff' stroke-opacity='.1'/>

  <!-- earned | claimable, connected grid split by a divider -->
  <rect x='24' y='200' width='302' height='80' rx='12' class='panel'/>
  <line x1='175' y1='212' x2='175' y2='268' stroke='#fff' stroke-opacity='.08'/>

  <ellipse cx='72' cy='222' rx='6' ry='4' fill='#1f9d77'/>
  <ellipse cx='72' cy='220' rx='6' ry='4' fill='#37d6a3'/>
  <ellipse cx='70' cy='219' rx='2' ry='1.2' fill='#fff' fill-opacity='.5'/>
  <text x='104' y='224' text-anchor='middle' class='t w4 lbl' font-size='11'>EARNED</text>
  <text x='99' y='250' text-anchor='middle' class='t w val' font-size='16'>0.078 <tspan class='w5 sym'>TKNA</tspan></text>
  <text x='99' y='271' text-anchor='middle' class='t w val' font-size='16'>2,450 <tspan class='w5 sym'>TKNB</tspan></text>

  <path d='M213 213 v7 m-3 -3 l3 3 l3 -3' stroke='#37d6a3' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/>
  <path d='M209 224 h8' stroke='#37d6a3' stroke-width='1.6' stroke-linecap='round'/>
  <text x='256' y='224' text-anchor='middle' class='t w4 lbl' font-size='11'>CLAIMABLE</text>
  <text x='251' y='250' text-anchor='middle' class='t g val' font-size='16'>0.0093 <tspan class='gs sym'>TKNA</tspan></text>
  <text x='251' y='271' text-anchor='middle' class='t g val' font-size='16'>180.5 <tspan class='gs sym'>TKNB</tspan></text>

  <!-- yield -->
  <text x='24' y='316' class='t w4 lbl' font-size='11'>YIELD</text>
  <text x='160' y='318' text-anchor='end' class='t w val' font-size='22'>0.80%</text>
  <text x='166' y='318' class='t w5' font-size='12'>life</text>
  <text x='288' y='318' text-anchor='end' class='t w val' font-size='22'>2.43%</text>
  <text x='294' y='318' class='t w5' font-size='12'>ann.</text>

  <!-- chips: fee + rebate + age (label subordinate to value) -->
  <rect x='42' y='338' width='86' height='32' rx='4' class='chip'/>
  <text x='85' y='358' text-anchor='middle' class='t' font-size='12'><tspan class='w4' font-size='10'>FEE </tspan><tspan class='w9 val'>0.05%</tspan></text>
  <rect x='136' y='338' width='100' height='32' rx='4' class='chip'/>
  <text x='186' y='358' text-anchor='middle' class='t' font-size='12'><tspan class='w4' font-size='10'>REBATE </tspan><tspan class='w9 val'>20%</tspan></text>
  <rect x='244' y='338' width='64' height='32' rx='4' class='chip'/>
  <text x='276' y='358' text-anchor='middle' class='t' font-size='12'><tspan class='w4' font-size='10'>AGE </tspan><tspan class='w9 val'>120d</tspan></text>

  <!-- market: live price + the position's set range, tied together by the in-range status -->
  <rect x='24' y='388' width='302' height='56' rx='8' fill='#fff' fill-opacity='.04'/>
  <circle cx='44' cy='414' r='4' fill='#37d6a3'/>
  <text x='56' y='418' class='t g' font-size='12' font-weight='600'>In Range</text>
  <text x='310' y='411' text-anchor='end' class='t w val' font-size='17'>3,002 <tspan class='w5' font-size='11'>TKNB/TKNA</tspan></text>
  <text x='196' y='434' class='t w4 lbl' font-size='9'>RANGE</text>
  <text x='310' y='434' text-anchor='end' class='m w9' font-size='12'>2,850 – 3,150</text>
</svg>
</body>
</html>
