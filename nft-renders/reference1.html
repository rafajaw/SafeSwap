<svg width="350" height="480" viewBox="0 0 350 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background / Card Shell -->
  <rect width="350" height="480" rx="24" fill="#081425" />
  <rect x="0.5" y="0.5" width="349" height="479" rx="23.5" stroke="white" stroke-opacity="0.1" />
  
  <!-- Subtle Header Gradient Overlay -->
  <rect width="350" height="240" rx="24" fill="url(#header_gradient)" fill-opacity="0.2" />

  <!-- Top Bar: ID and Status -->
  <text x="24" y="44" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="20" font-weight="600">#2</text>
  
  <!-- In Range Pill -->
  <rect x="230" y="24" width="96" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.4" />
  <circle cx="244" cy="38" r="4" fill="#10B981" />
  <text x="254" y="42" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="600">In Range</text>

  <!-- Section: Hero - Current Position -->
  <text x="175" y="96" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">CURRENT POSITION</text>
  
  <!-- Token 0 (ETH) -->
  <g transform="translate(87, 140)">
    <text x="0" y="0" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="36" font-weight="500">0.42</text>
    <text x="0" y="28" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="16" font-weight="500">ETH</text>
  </g>
  
  <!-- Token 1 (USDC) -->
  <g transform="translate(262, 140)">
    <text x="0" y="0" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="36" font-weight="500">1,280</text>
    <text x="0" y="28" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="16" font-weight="500">USDC</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="190" x2="326" y2="190" stroke="white" stroke-opacity="0.1" />

  <!-- Section: Middle Split (Earned vs Claimable) -->
  <g transform="translate(24, 214)">
    <!-- Earned -->
    <path d="M0 4H14M0 8H14M0 12H14" stroke="white" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="20" y="12" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="12" font-weight="600">Earned</text>
    <text x="0" y="34" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">0.078 ETH</text>
    <text x="0" y="52" fill="white" fill-opacity="0.5" font-family="Inter, sans-serif" font-size="14">2450 USDC</text>
  </g>

  <line x1="175" y1="210" x2="175" y2="270" stroke="white" stroke-opacity="0.1" />

  <g transform="translate(190, 214)">
    <!-- Claimable -->
    <rect x="0" y="2" width="12" height="10" rx="2" stroke="#10B981" stroke-width="1.5" />
    <text x="18" y="12" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="12" font-weight="600">Claimable</text>
    <text x="0" y="34" fill="#10B981" font-family="Inter, sans-serif" font-size="16" font-weight="600">0.0093 ETH</text>
    <text x="0" y="52" fill="white" fill-opacity="0.5" font-family="Inter, sans-serif" font-size="14">180.5 USDC</text>
  </g>

  <!-- Section: Yield -->
  <line x1="24" y1="286" x2="326" y2="286" stroke="white" stroke-opacity="0.1" />
  
  <text x="24" y="316" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="14">Yield</text>
  <text x="165" y="316" text-anchor="end" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">0.80%</text>
  <text x="170" y="316" fill="white" fill-opacity="0.4" font-family="Inter, sans-serif" font-size="12">life</text>
  
  <text x="290" y="316" text-anchor="end" fill="#10B981" font-family="Inter, sans-serif" font-size="16" font-weight="600">2.43%</text>
  <text x="295" y="316" fill="white" fill-opacity="0.4" font-family="Inter, sans-serif" font-size="12">ann.</text>

  <!-- Section: Chips -->
  <g transform="translate(24, 344)">
    <rect width="76" height="32" rx="4" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" />
    <text x="38" y="21" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="11">FEE <tspan font-weight="600" fill-opacity="0.9">0.05%</tspan></text>
    
    <rect x="88" width="88" height="32" rx="4" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" />
    <text x="132" y="21" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="11">REBATE <tspan font-weight="600" fill-opacity="0.9">20%</tspan></text>

    <rect x="188" width="76" height="32" rx="4" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" />
    <text x="226" y="21" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="11">AGE <tspan font-weight="600" fill-opacity="0.9">120d</tspan></text>
  </g>

  <!-- Section: Ticks -->
  <rect x="24" y="396" width="302" height="40" rx="8" fill="white" fill-opacity="0.03" />
  <text x="175" y="421" text-anchor="middle" fill="white" fill-opacity="0.4" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em">
    TICKS  -887220  →  887220
  </text>

  <!-- Definitions for Gradients/Filters -->
  <defs>
    <linearGradient id="header_gradient" x1="175" y1="0" x2="175" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    
    <!-- Potential Glassmorphism Blur (Standard SVG filter) -->
    <filter id="glass_blur" x="-20" y="-20" width="390" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="BackgroundImageFix" stdDeviation="20"/>
      <feComposite in2="SourceAlpha" operator="in" result="effect1_backgroundBlur"/>
      <feBlend mode="normal" in="SourceGraphic" in2="effect1_backgroundBlur" result="shape"/>
    </filter>
  </defs>
</svg>
