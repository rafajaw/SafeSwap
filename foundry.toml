[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
evm_version = "cancun"  # Max compatibility - still support TSTORE, MCOPY and PUSH0.
optimizer = true
optimizer_runs = 200
via_ir = true
# *PROVENANCE*  -  Keep the default IPFS source-metadata hash in the bytecode so the deployed contracts embed a verifiable
# fingerprint of the exact source — enabling a perfect-match explorer verification against the canonical (single-commit) source.
# The trade-off (deliberate): the bytecode — and therefore every mined CREATE2 hook address — is bound to the EXACT source set:
# each compiled `.sol`'s content (INCLUDING comments / NatSpec), its file path / folder layout, the pinned `lib/` submodule
# commits, the remappings, and the compiler settings. So the `contracts/` tree + `lib/` submodules + these settings must be
# FROZEN before building artifacts and mining; only the frontend / SDK / docs (not in the compile graph) stay free. Reproducible
# across machines given the same repo layout. Inherited by every deploy profile.
bytecode_hash = "ipfs"
ignored_error_codes = [6335, 2424, 2394, 4591]
extra_output = ["ir", "irOptimized"]
extra_output_files = ["ir", "irOptimized"]
sizes = true
gas_reports = ['*']
remappings = [
    "@SafeSwapRouter=contracts/Router/",
    "@SafeSwapHook=contracts/Hook/",
    "@SafeSwapNft=contracts/Nft/",
    "@SafeSwapCommon=contracts/Common/",
    "@SafeSwapRelayer=contracts/Relayer/",
    "@BondRoute=lib/BondRoute/src/",
    "@BondRouteProtected=lib/BondRoute/src/integrations/",
    "@ChainConfig=lib/ChainConfig/src/integrations/",
    "@ChainConfigCore=lib/ChainConfig/src/",
    "@UniswapV4Core=lib/v4-core/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@OpenZeppelin=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@Solady=lib/solady/src/",
    "@test=test/",
]

fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./out-deploy-hook" },
    { access = "read", path = "./out-deploy-router" },
    { access = "read", path = "./out-deploy-nft" },
    { access = "read", path = "./out-deploy-descriptor" },
    { access = "read", path = "./out-deploy-signing-descriptor" },
    { access = "read", path = "./out-deploy-relayer" },
]

# Deployment profiles compile one deployable contract family per artifact dir, so each deployed bytecode can use the
# highest optimizer run count that still fits EIP-170 without overwriting another deploy artifact.
#
# *DETERMINISM*  -  `solc` is pinned in each deploy profile (NOT in [profile.default]) so the DEPLOYED bytecode is
# reproducible: fixed solc + evm_version + optimizer settings ⇒ identical bytecode ⇒ stable CREATE2 addresses (the mined hook
# salts depend on this) and explorer-verifiable artifacts. The default profile stays unpinned because the test suite deploys
# the real Uniswap V4 PoolManager, whose one source file pins `=0.8.26`; a global solc force would fail on it. Deploy profiles
# skip tests, so they never compile that file. (0.8.35 is also what ChainConfig hard-pins via `=0.8.35`.)
[profile.deploy_hook]
out = "out-deploy-hook"
solc = "0.8.35"
optimizer_runs = 2_000_000_000  # SafeSwapHookImpl 10,291 B (EIP-170 margin 14,285) — loose; pinned at the 2e9 ceiling
skip = ["test/**", "script/**", "contracts/Router/**", "contracts/Nft/**"]

[profile.deploy_router]
out = "out-deploy-router"
solc = "0.8.35"
optimizer_runs = 2_000_000_000  # SafeSwapRouter 20,778 B (EIP-170 margin 3,798) — loose; pinned at the 2e9 ceiling
skip = [
    "test/**",
    "script/**",
    "contracts/Nft/**",
    "contracts/Hook/**",
    "contracts/Common/SafeSwapSigningDescriptor.sol"
]

[profile.deploy_nft]
out = "out-deploy-nft"
solc = "0.8.35"
optimizer_runs = 25_000  # SafeSwapNft 24,320 B (EIP-170 margin 256) — bisected max; plateau 20k-25k, 30k overflows with metadata
skip = [
    "test/**",
    "script/**",
    "contracts/Router/**",
    "contracts/Hook/**",
    "contracts/Nft/SafeSwapPositionDescriptor.sol",
    "contracts/Common/SafeSwapSigningDescriptor.sol"
]

[profile.deploy_descriptor]
out = "out-deploy-descriptor"
solc = "0.8.35"
optimizer_runs = 900  # SafeSwapPositionDescriptor 24,251 B (EIP-170 margin 325) — bisected max; tight, 950 steps over the limit
skip = [
    "test/**",
    "script/**",
    "contracts/Router/**",
    "contracts/Hook/**",
    "contracts/Nft/SafeSwapNft.sol",
    "contracts/Common/SafeSwapSigningDescriptor.sol"
]

[profile.deploy_signing_descriptor]
out = "out-deploy-signing-descriptor"
solc = "0.8.35"
optimizer_runs = 2_000_000_000  # SafeSwapSigningDescriptor 18,543 B (EIP-170 margin 6,033) — loose; pinned at the 2e9 ceiling
skip = [
    "test/**",
    "script/**",
    "contracts/Router/**",
    "contracts/Hook/**",
    "contracts/Nft/SafeSwapNft.sol",
    "contracts/Nft/SafeSwapPositionDescriptor.sol"
]

# The 7702 delegate depends on lib code (BondRoute interfaces + Solady + OZ + ChainConfig) plus the SafeSwapCommon constants
# file (Definitions.sol, compiled as a dependency); it pulls in none of the SafeSwap family contracts, so it stays isolated.
[profile.deploy_relayer]
out = "out-deploy-relayer"
solc = "0.8.35"
optimizer_runs = 2_000_000_000  # SafeSwap7702Delegate 7,264 B (EIP-170 margin 17,312) — loose; pinned at the 2e9 ceiling
skip = [
    "test/**",
    "script/**",
    "contracts/Router/**",
    "contracts/Hook/**",
    "contracts/Nft/**",
    "contracts/Common/**"
]

[invariant]
runs = 32
depth = 64

[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "unaliased-plain-import",
    "unsafe-typecast"
]
